# Pushes to main and pull requests: the DLL, the preview and the tests build, the tests pass, and what is made from
# the sources (docs/Conventions.md, the demo's host block, its import) matches them. Another branch is checked
# through its pull request: a push to every branch as well ran each check twice for it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build UIFramework.slnx -nologo
      - run: dotnet test src/UIFramework.Tests/UIFramework.Tests.csproj --no-build -nologo
      - name: docs/Conventions.md matches the conventions
        shell: powershell
        run: ./tools/conventions-doc.ps1 -Check
      # The checks of tools/check-stub.ps1 that need no Streamer.bot, and the same for the eight games' copies in hosts/:
      # each holds its game's table and window in the current template (tools/update-host-block.ps1 refreshes them).
      - name: The demo and hosts/ carry the template's host block
        shell: powershell
        run: |
          ./tools/update-host-block.ps1 -File examples/DemoGame/DemoGame.cs -Check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($block in Get-ChildItem hosts -Recurse -Filter HostBlock.cs) {
            ./tools/update-host-block.ps1 -File $block.FullName -Check
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: The demo's import carries the demo and the stub
        shell: powershell
        run: ./tools/build-import.ps1 -Check
