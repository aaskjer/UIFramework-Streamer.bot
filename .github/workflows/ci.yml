# Every push and pull request: the DLL, the preview and the tests build, and the tests pass.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build UIFramework.slnx -nologo
      - run: dotnet test src/UIFramework.Tests/UIFramework.Tests.csproj --no-build -nologo
