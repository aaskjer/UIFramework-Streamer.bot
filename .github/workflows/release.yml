# On a tag vX.Y.Z: build the DLL, run the tests, publish the tag's release with UIFramework.dll and the version's
# section of CHANGELOG.md as its notes (a pre-release before 1.0.0), and write lib/v1/latest.json (version, url,
# sha256) back to main, which is what every host's loader reads.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

# Two tags pushed close together write latest.json one after the other, never at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      # The tag's own commit is built, not main's tip: a commit that landed on main after the tag never ships under
      # the tag's version. latest.json is written to main afterwards, in a step of its own.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is on main
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error "${{ github.ref_name }} is not on main; tag a commit of main." }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from the tag
        id: v
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          $csproj = 'src/UIFramework/UIFramework.csproj'
          $xml = Get-Content $csproj -Raw
          if ($xml -notmatch "<Version>$([regex]::Escape($version))</Version>") {
            Write-Error "The tag says $version but UIFramework.csproj says $([regex]::Match($xml, '<Version>([^<]+)</Version>').Groups[1].Value); bump the csproj first."
          }
          "prerelease=$(if ($version -like '0.*') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ steps.v.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") { $start = $i + 1; break } }
          if ($start -lt 0) { Write-Error "CHANGELOG.md has no section '## [$version]'; write what changed before tagging." }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { $end = $i; break } }
          $notes = ($lines[$start..($end - 1)] -join "`n").Trim()
          if ($notes.Length -eq 0) { Write-Error "CHANGELOG.md section '## [$version]' is empty." }
          [IO.File]::WriteAllText('notes.md', $notes + "`n", (New-Object Text.UTF8Encoding $false))

      - name: Build and test
        run: |
          dotnet build UIFramework.slnx -c Release -nologo
          dotnet test src/UIFramework.Tests/UIFramework.Tests.csproj -c Release --no-build -nologo

      - name: Hash
        id: h
        shell: pwsh
        run: |
          $dll = 'src/UIFramework/bin/Release/net48/UIFramework.dll'
          $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Copy-Item $dll UIFramework.dll
          Add-Content notes.md "`nSHA-256 of UIFramework.dll: ``$sha``"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: UIFramework.dll
          name: UIFramework v${{ steps.v.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}

      - name: Write lib/v1/latest.json
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $version = '${{ steps.v.outputs.version }}'
          for ($try = 1; $try -le 3; $try++) {
            git fetch origin main --quiet
            git checkout -B main origin/main --quiet
            # minHostStub is kept from main's latest.json (raise it there when a release needs a newer stub), and an
            # older tag released late never takes latest.json back below what is out already.
            $current = Get-Content lib/v1/latest.json -Raw | ConvertFrom-Json
            if ([version]$current.version -gt [version]$version) {
              Write-Host "latest.json names $($current.version), newer than $version; left as it is."
              exit 0
            }
            $latest = [ordered]@{
              version     = $version
              url         = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/UIFramework.dll'
              sha256      = '${{ steps.h.outputs.sha }}'
              minHostStub = $(if ($current.minHostStub) { $current.minHostStub } else { '0.1.0' })
              note        = 'Read by the loader in every host''s settings action. Written by .github/workflows/release.yml on a tag vX.Y.Z.'
            }
            $json = ($latest | ConvertTo-Json) + "`n"
            [IO.File]::WriteAllText('lib/v1/latest.json', $json, (New-Object Text.UTF8Encoding $false))
            git add lib/v1/latest.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host 'latest.json already says this.'; exit 0 }
            git commit -m "latest.json: ${{ github.ref_name }}" --quiet
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "main moved meanwhile; trying again ($try)."
          }
          Write-Error 'latest.json could not be pushed to main.'
