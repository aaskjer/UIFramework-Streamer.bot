# On a tag vX.Y.Z: build the DLL, run the tests, publish the tag's release with UIFramework.dll and the version's
# section of CHANGELOG.md as its notes (stable only for a round X.0.0; every other version is a pre-release), and write lib/v<major>/latest.json
# (version, url, sha256) back to main, which is what the loader of every host of that major line reads: 1.x.y goes to
# lib/v1, 2.0.0 and what follows it to lib/v2, so a v1 host is never offered a 2.x.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

# One run per tag, and a tag's run is never cancelled. A single group for all tags dropped a release: GitHub keeps one
# run waiting per group, so a third tag pushed while two were in the queue cancelled the second. Two runs that reach
# latest.json at once are handled where it is written (fetch, write, push, three tries; never back to an older version).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      # The tag's own commit is built, not main's tip: a commit that landed on main after the tag never ships under
      # the tag's version. latest.json is written to main afterwards, in a step of its own.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is on main
        shell: pwsh
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error "${{ github.ref_name }} is not on main; tag a commit of main." }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from the tag
        id: v
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # Three numbers and nothing else: a pre-release tag (v1.0.0-rc1) stops here, before anything is published,
          # since the loader and latest.json know plain versions only.
          if ($version -notmatch '^\d+\.\d+\.\d+$') { Write-Error "$tag is not vX.Y.Z; only plain versions are released." }
          "version=$version" >> $env:GITHUB_OUTPUT
          # The major line names the folder of latest.json: lib/v1 for 1.x.y, lib/v2 from 2.0.0 on.
          "latest=lib/v$($version.Split('.')[0])/latest.json" >> $env:GITHUB_OUTPUT
          $csproj = 'src/UIFramework/UIFramework.csproj'
          $xml = Get-Content $csproj -Raw
          if ($xml -notmatch "<Version>$([regex]::Escape($version))</Version>") {
            Write-Error "The tag says $version but UIFramework.csproj says $([regex]::Match($xml, '<Version>([^<]+)</Version>').Groups[1].Value); bump the csproj first."
          }
          # The oldest settings action this DLL works with, for latest.json: the DLL carries it in its product version
          # and refuses an older stub itself. A tag from before 1.8.4 names none; latest.json's own is kept then.
          "stub=$([regex]::Match($xml, '<MinHostStub>([^<]+)</MinHostStub>').Groups[1].Value)" >> $env:GITHUB_OUTPUT
          # Stable releases are round versions only (2.0.0, 3.0.0); everything else is a pre-release (2026-11-08).
          "prerelease=$(if ($version -notmatch '^[1-9][0-9]*\.0\.0$') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ steps.v.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") { $start = $i + 1; break } }
          if ($start -lt 0) { Write-Error "CHANGELOG.md has no section '## [$version]'; write what changed before tagging." }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { $end = $i; break } }
          $notes = ($lines[$start..($end - 1)] -join "`n").Trim()
          if ($notes.Length -eq 0) { Write-Error "CHANGELOG.md section '## [$version]' is empty." }
          [IO.File]::WriteAllText('notes.md', $notes + "`n", (New-Object Text.UTF8Encoding $false))

      # Two steps: in one, only the last command's exit code counted, and a build that failed in the preview alone
      # was followed by tests that passed.
      - name: Build
        run: dotnet build UIFramework.slnx -c Release -nologo

      - name: Test
        run: dotnet test src/UIFramework.Tests/UIFramework.Tests.csproj -c Release --no-build -nologo

      - name: Hash
        id: h
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dll = 'src/UIFramework/bin/Release/net48/UIFramework.dll'
          # A re-run keeps the DLL the release has already: a rebuild can differ by a byte, and hosts would meet a
          # hash in latest.json that their download does not match.
          gh release download '${{ github.ref_name }}' --pattern UIFramework.dll --output published.dll --clobber 2>$null
          if ($LASTEXITCODE -eq 0 -and (Test-Path published.dll)) {
            Write-Host 'The release has its UIFramework.dll already; it is kept.'
            $dll = 'published.dll'
          }
          $global:LASTEXITCODE = 0
          $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Copy-Item $dll UIFramework.dll
          Add-Content notes.md "`nSHA-256 of UIFramework.dll: ``$sha``"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: UIFramework.dll
          name: UIFramework v${{ steps.v.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}

      - name: Write ${{ steps.v.outputs.latest }}
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $version = '${{ steps.v.outputs.version }}'
          $path = '${{ steps.v.outputs.latest }}'
          for ($try = 1; $try -le 3; $try++) {
            git fetch origin main --quiet
            git checkout -B main origin/main --quiet
            # minHostStub is the tag's own (MinHostStub in UIFramework.csproj; raise it there when a release needs a
            # newer stub), and an older tag released late never takes latest.json back below what is out already. The
            # first release of a major line finds no file: its folder is made here.
            $current = if (Test-Path $path) { Get-Content $path -Raw | ConvertFrom-Json } else { $null }
            if ($current -and $current.version -and [version]$current.version -gt [version]$version) {
              Write-Host "latest.json names $($current.version), newer than $version; left as it is."
              exit 0
            }
            $latest = [ordered]@{
              version     = $version
              url         = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/UIFramework.dll'
              sha256      = '${{ steps.h.outputs.sha }}'
              minHostStub = $(if ('${{ steps.v.outputs.stub }}') { '${{ steps.v.outputs.stub }}' } elseif ($current -and $current.minHostStub) { $current.minHostStub } else { '0.1.0' })
              note        = 'Read by the loader in every host''s settings action. Written by .github/workflows/release.yml on a tag vX.Y.Z.'
            }
            $json = ($latest | ConvertTo-Json) + "`n"
            New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
            [IO.File]::WriteAllText((Join-Path $PWD $path), $json, (New-Object Text.UTF8Encoding $false))
            git add $path
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host 'latest.json already says this.'; exit 0 }
            git commit -m "latest.json: ${{ github.ref_name }}" --quiet
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "main moved meanwhile; trying again ($try)."
          }
          Write-Error 'latest.json could not be pushed to main.'
